<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Video Player with Volume & Quality Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    /* Player Container */
    .player-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* YouTube Iframe Wrap */
    .iframe-wrapper {
      position: absolute;
      top: -60px;
      left: 0;
      width: 100%;
      height: calc(100% + 120px);
      pointer-events: none;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Invisible Overlay to block click/redirect */
    .click-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 50px);
      z-index: 10;
      cursor: pointer;
    }

    /* Custom Controls Bar */
    .controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 15px;
      z-index: 20;
    }

    .btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      color: #38bdf8;
    }

    /* Volume Control Section */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-slider {
      width: 60px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
    }

    /* Progress Bar */
    .progress-container {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      border-radius: 5px;
      pointer-events: none;
    }

    /* Time Display */
    .time-display {
      color: #fff;
      font-size: 12px;
      min-width: 75px;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="iframe-wrapper">
      <div id="yt-player"></div>
    </div>

    <div class="click-overlay" id="clickOverlay"></div>

    <div class="controls-bar">
      <!-- Play / Pause Button -->
      <button class="btn" id="playPauseBtn">▶</button>
      
      <!-- Volume Controls -->
      <div class="volume-container">
        <button class="btn" id="muteBtn">🔊</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
      </div>

      <!-- Video Progress Bar -->
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <!-- Time Display -->
      <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
      
      <!-- Fullscreen Button -->
      <button class="btn" id="fullscreenBtn">⛶</button>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    const videoId = 'jPxsMXBjq8I'; // আপনার ভিডিওর ID এখানে দিন

    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const timeDisplay = document.getElementById('timeDisplay');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const clickOverlay = document.getElementById('clickOverlay');
    const playerContainer = document.querySelector('.player-container');

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        videoId: videoId,
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'modestbranding': 1,
          'rel': 0,
          'showinfo': 0,
          'iv_load_policy': 3,
          'cc_load_policy': 0,
          'fs': 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      // 480p (Large) Quality Request (ইউটিউব সাপোর্ট করলে অটোমেটিক ৪৮০p তে প্লে হবে)
      if (player.setPlaybackQualityRange) {
        player.setPlaybackQualityRange('large', 'large');
      }
      
      setInterval(updateProgress, 500);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        playPauseBtn.innerText = '❚❚';
        // ভিডিও প্লে শুরু হলে আবার 480p কোয়ালিটি রি-এপ্লাই করার চেষ্টা করবে
        if (player.setPlaybackQuality) {
          player.setPlaybackQuality('large');
        }
      } else {
        playPauseBtn.innerText = '▶';
      }
    }

    // Play / Pause Toggle
    function togglePlay() {
      if (!player) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    playPauseBtn.addEventListener('click', togglePlay);
    clickOverlay.addEventListener('click', togglePlay);

    // Volume Slider & Mute Functionality
    volumeSlider.addEventListener('input', (e) => {
      const volume = e.target.value;
      player.setVolume(volume);
      if (volume == 0) {
        muteBtn.innerText = '🔇';
      } else {
        muteBtn.innerText = '🔊';
      }
    });

    muteBtn.addEventListener('click', () => {
      if (player.isMuted()) {
        player.unMute();
        muteBtn.innerText = '🔊';
        volumeSlider.value = player.getVolume() || 100;
      } else {
        player.mute();
        muteBtn.innerText = '🔇';
        volumeSlider.value = 0;
      }
    });

    // Update Time and Progress Bar
    function updateProgress() {
      if (player && player.getCurrentTime) {
        const currentTime = player.getCurrentTime();
        const duration = player.getDuration();
        
        if (duration > 0) {
          const percentage = (currentTime / duration) * 100;
          progressBar.style.width = percentage + '%';
          timeDisplay.innerText = `${formatTime(currentTime)} / ${formatTime(duration)}`;
        }
      }
    }

    // Seek / Timeline Click
    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const clickPosition = (e.clientX - rect.left) / rect.width;
      const duration = player.getDuration();
      player.seekTo(clickPosition * duration, true);
    });

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Fullscreen Toggle
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        playerContainer.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Disable Right Click
    playerContainer.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
